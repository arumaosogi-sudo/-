<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ไม่มีอินเทอร์เน็ต · กระปุกห้องเรียน</title>
    <style>
      :root { color-scheme: light dark; --bg: #fbfaf6; --fg: #1d2b27; --muted: #6b7773; --brand: #2f9e7a; }
      @media (prefers-color-scheme: dark) { :root { --bg: #111a18; --fg: #eef5f2; --muted: #a3b0ac; --brand: #5cc9a3; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; text-align: center; }
      h1 { font-size: 1.4rem; margin: 16px 0 8px; }
      p { color: var(--muted); margin: 0 0 20px; }
      button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 12px 24px; background: var(--brand); color: white; }
    </style>
  </head>
  <body>
    <main>
      <div style="font-size: 3rem" aria-hidden="true">📶</div>
      <h1>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
      <p>ตรวจสอบ Wi-Fi หรืออินเทอร์เน็ตมือถือ แล้วลองใหม่อีกครั้ง</p>
      <button type="button" onclick="location.reload()">ลองใหม่</button>
    </main>
  </body>
</html>
